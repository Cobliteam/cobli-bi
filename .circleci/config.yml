version: 2.1

orbs:
  win: circleci/windows@2.2.0

jobs:
  build:
    executor:
      name: win/default
      size: 'medium'
    environment:
      # Use the executor's Python 3.12; never download another one.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - checkout
      - run:
          name: installing dependencies
          # uv, pinned and checked against the SHA-256 published with the
          # release, installs PyInstaller and its dependencies from
          # build-tools/uv.lock, checking every artifact against its hash.
          # --locked refuses a lock that no longer matches pyproject.toml.
          command: |
            $version = "0.10.2"
            $sha256 = "493ebbe0e06128d6ee4905e1ed5e2a433fb0f7cfc08b0eaca9fab4ca76778ae1"
            Invoke-WebRequest -Uri "https://github.com/astral-sh/uv/releases/download/$version/uv-x86_64-pc-windows-msvc.zip" -OutFile uv.zip
            if ((Get-FileHash uv.zip -Algorithm SHA256).Hash -ne $sha256) { throw "uv.zip does not match the expected SHA-256" }
            Expand-Archive uv.zip -DestinationPath "$HOME\uvbin"
            & "$HOME\uvbin\uv.exe" sync --locked --project build-tools --python 3.12
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run:
          name: creating executable
          command: |
            & "$HOME\uvbin\uv.exe" run --locked --project build-tools pyinstaller ./src/main.py --onefile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cp -R requirements.txt dist
            Compress-Archive -Path dist, output, src -DestinationPath cobli-bi.zip
      - persist_to_workspace:
          root: .
          paths:
            - cobli-bi.zip
  publish_release:
    docker:
      - image: cibuilds/github:0.10
    steps:
      - attach_workspace:
          at: ./artifacts
      - run:
          name: 'Publish Release on GitHub'
          command: |
            VERSION=0.0.8
            ghr \
            -t ${GITHUB_TOKEN} \
            -u ${CIRCLE_PROJECT_USERNAME} \
            -r ${CIRCLE_PROJECT_REPONAME} \
            -c ${CIRCLE_SHA1} \
            -delete ${VERSION} ./artifacts/

workflows:
  version: 2
  test_and_publish:
    jobs:
      - build
      - publish_release:
          context: circleci-github-release
          requires:
            - build
          filters:
            tags:
              only: /^\d+\.\d+\.\d+$/
            branches:
              only: master
